<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliophile - Curate Your Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="background-accent"></div>
    
    <div class="container">
        <header>
            <h1>Bibliophile</h1>
            <p>Your minimalist book collection manager.</p>
        </header>

        <main>
            <section class="book-form glass-panel">
                <h2 id="form-title">Add New Book</h2>
                <form id="bookForm">
                    <input type="hidden" id="bookId">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" placeholder="e.g., The Alchemist" required>
                    </div>
                    <div class="form-group">
                        <label for="author">Author</label>
                        <input type="text" id="author" placeholder="e.g., Paulo Coelho" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="submitBtn" class="btn-primary">Add to Library</button>
                        <button type="button" id="cancelBtn" class="btn-secondary hidden">Cancel</button>
                    </div>
                </form>
            </section>

            <section class="book-list-container">
                <div class="list-header">
                    <h2>Your Collection</h2>
                    <span id="bookCount" class="badge">0 books</span>
                </div>
                <div id="bookList" class="book-grid">
                    <!-- Books will be injected here via JS -->
                    <div class="loading-spinner"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
